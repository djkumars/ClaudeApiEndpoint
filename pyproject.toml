[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-api-tester"
version = "0.1.0"
description = "Discover Claude models and test their API endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.52.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.scripts]
claude-api-tester = "claude_api_tester.cli:main"
claude-list-models = "claude_api_tester.list_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
